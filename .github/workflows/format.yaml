name: Format

on: push

jobs:
  format-code:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27

      - name: Run go fmt
        run: go fmt ./...

      - name: Run go fix
        run: go fix ./...

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-format code"
